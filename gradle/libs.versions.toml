[versions]
agp = "8.7.2"
kotlin = "2.0.21"
compose-multiplatform = "1.7.1"
sqldelight = "2.0.2"
ktor = "3.0.1"
koin = "4.0.0"
coroutines = "1.9.0"
firebase-kotlin = "2.1.0"
serialization = "1.7.3"
datetime = "0.6.1"
androidx-activity-compose = "1.9.3"
androidx-biometric = "1.1.0"
lifecycle-viewmodel = "2.8.7"
google-services = "4.4.2"
detekt = "1.23.7"
ktlint = "12.1.2"
turbine = "1.2.0"

[libraries]
# SQLDelight
sqldelight-runtime        = { module = "app.cash.sqldelight:runtime",              version.ref = "sqldelight" }
sqldelight-coroutines     = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver",        version.ref = "sqldelight" }
sqldelight-native-driver  = { module = "app.cash.sqldelight:native-driver",         version.ref = "sqldelight" }

# Ktor
ktor-core   = { module = "io.ktor:ktor-client-core",   version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# Koin
koin-core              = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
koin-compose           = { module = "io.insert-koin:koin-compose",           version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android           = { module = "io.insert-koin:koin-android",           version.ref = "koin" }

# Kotlinx
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-datetime      = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "datetime" }

# Firebase (GitLive KMP wrapper — requires google-services.json / GoogleService-Info.plist)
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebase-kotlin" }
firebase-auth      = { module = "dev.gitlive:firebase-auth",      version.ref = "firebase-kotlin" }
firebase-storage   = { module = "dev.gitlive:firebase-storage",   version.ref = "firebase-kotlin" }

# Test
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine                  = { module = "app.cash.turbine:turbine",                       version.ref = "turbine" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose",           version.ref = "androidx-activity-compose" }
androidx-biometric        = { module = "androidx.biometric:biometric",                  version.ref = "androidx-biometric" }
lifecycle-viewmodel        = { module = "androidx.lifecycle:lifecycle-viewmodel",        version.ref = "lifecycle-viewmodel" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel" }

[plugins]
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",          version.ref = "kotlin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",                 version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                       version.ref = "compose-multiplatform" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
android-application   = { id = "com.android.application",                     version.ref = "agp" }
android-library       = { id = "com.android.library",                         version.ref = "agp" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
sqldelight            = { id = "app.cash.sqldelight",                         version.ref = "sqldelight" }
google-services       = { id = "com.google.gms.google-services",              version.ref = "google-services" }
detekt                = { id = "io.gitlab.arturbosch.detekt",                  version.ref = "detekt" }
ktlint                = { id = "org.jlleitschuh.gradle.ktlint",               version.ref = "ktlint" }
